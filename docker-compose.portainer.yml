# Portainer Web Editor stack. All host configuration is supplied in Portainer.
services:
  media:
    image: alpine/git:latest
    restart: "no"
    volumes:
      - exercise_images:/out/img
      - exercise_gifs:/out/gif
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if [ ! -f /out/img/.complete ] || [ ! -f /out/gif/.complete ]; then
          echo "Downloading exercise media from upstream; see NOTICE.md for licensing."
          workdir=$$(mktemp -d)
          trap 'rm -rf "$$workdir"' EXIT
          git clone --depth 1 https://github.com/hasaneyldrm/exercises-dataset "$$workdir/dataset"
          cp "$$workdir/dataset/images/"*.jpg /out/img/
          cp "$$workdir/dataset/videos/"*.gif /out/gif/
          touch /out/img/.complete /out/gif/.complete
        fi

  api:
    image: ${OPENGYM_API_IMAGE:?Set OPENGYM_API_IMAGE}:${OPENGYM_TAG:?Set OPENGYM_TAG}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - "traefik.enable=false"
    environment:
      PORT: "3000"
      DATA_DIR: /data
      TRUST_PROXY: "1"
      RP_ID: ${OPENGYM_HOST:?Set OPENGYM_HOST}
      ORIGIN: https://${OPENGYM_HOST:?Set OPENGYM_HOST}
      RP_NAME: ${RP_NAME:-openGym}
      ADMIN_UIDS: ${ADMIN_UIDS:-}
      INVITE_ONLY: ${INVITE_ONLY:-0}
      ALLOW_GUEST: ${ALLOW_GUEST:-1}
      DEFAULT_LANG: ${DEFAULT_LANG:-en}
      PASSWORD_LOGIN: ${PASSWORD_LOGIN:-0}
      COACH_DISABLED: ${COACH_DISABLED:-0}
    volumes:
      - application_data:/data
      - coach_auth:/coach-auth
    networks:
      - application

  web:
    image: ${OPENGYM_WEB_IMAGE:?Set OPENGYM_WEB_IMAGE}:${OPENGYM_TAG:?Set OPENGYM_TAG}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      media:
        condition: service_completed_successfully
      api:
        condition: service_started
    environment:
      NGINX_PORT: "80"
      BACKEND: api
      PORT: "3000"
      RESOLVER: "127.0.0.11"
      MEDIA_UPLOAD_MAX: ${MEDIA_UPLOAD_MAX:-48m}
    volumes:
      - exercise_images:/usr/share/nginx/html/img:ro
      - exercise_gifs:/usr/share/nginx/html/gif:ro
    networks:
      - application
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:?Set TRAEFIK_NETWORK}"
      - "traefik.http.routers.opengym.rule=Host(`${OPENGYM_HOST:?Set OPENGYM_HOST}`)"
      - "traefik.http.routers.opengym.entrypoints=${TRAEFIK_HTTPS_ENTRYPOINT:?Set TRAEFIK_HTTPS_ENTRYPOINT}"
      - "traefik.http.routers.opengym.tls=true"
      - "traefik.http.routers.opengym.tls.certresolver=${TRAEFIK_CERT_RESOLVER:?Set TRAEFIK_CERT_RESOLVER}"
      - "traefik.http.routers.opengym.service=opengym"
      - "traefik.http.services.opengym.loadbalancer.server.port=80"

volumes:
  application_data:
  coach_auth:
  exercise_images:
  exercise_gifs:

networks:
  application:
  proxy:
    external: true
    name: ${TRAEFIK_NETWORK:?Set TRAEFIK_NETWORK}
